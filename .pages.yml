# Generated by scripts/build.mjs from the bidding schema.
# Edit the schema in scripts/cms.mjs, then run npm run build.
settings:
  content:
    merge: true
content:
  -
    name: "bidding"
    label: "Bidding system"
    type: "collection"
    path: "content/bidding"
    format: "json"
    subfolders: true
    description: "For Uncontested, open an opening-bid folder. For Contested: Our opening, open contested first. For Contested: Opponent opening, open defense first. Then open an opening-bid folder and search by auction or meaning. Use Add an entry to add a branch. Search all auctions at https://penghaowang1225.github.io/bridge/scanian/?edit=1&view=all and follow Edit in Pages CMS. For Uncontested, enter only our calls, such as 1NT-2C-2S. For both Contested sections, include every call. Choose Our opening when our side opens. Choose Opponent opening when the opponents open. The build finds the parent, folder, and bidding order."
    filename:
      template: "{section}--{auction}.json"
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields:
        - "order"
        - "auction"
        - "meaning"
        - "section"
      primary: "auction"
      search:
        - "auction"
        - "meaning"
        - "notes"
        - "fullAuction"
      sort:
        - "order"
        - "auction"
      default:
        sort: "order"
        order: "asc"
    fields:
      -
        name: "id"
        label: "Permanent ID"
        type: "uuid"
        required: true
        hidden: true
        readonly: true
        options:
          editable: false
          generate: false
      -
        name: "section"
        label: "Section"
        type: "select"
        required: true
        default: "uncontested"
        options:
          values:
            -
              value: "uncontested"
              label: "Uncontested"
            -
              value: "contested"
              label: "Contested: Our opening"
            -
              value: "defense"
              label: "Contested: Opponent opening"
      -
        name: "auction"
        label: "Auction"
        type: "string"
        required: true
        description: "Use letters and hyphens. Uncontested: enter only our calls, such as 1NT-2C-2S. Contested: Our opening: enter all calls, such as 1H-P-1S-2C. Contested: Opponent opening: enter all calls, such as 1NT-X. Use P for pass, X for double, and XX for redouble. To add a child, copy the parent auction and append the next call(s)."
        pattern:
          regex: "^[1-7](?:[cCdDhHsS]|[nN][tT]?)(?:[ -]+(?:[1-7](?:[cCdDhHsS]|[nN][tT]?)|[pP]|[xX]{1,2}))*$"
          message: "Use calls such as 1NT-2C-2S, with C, D, H, S, NT, P, X, or XX."
      -
        name: "meaning"
        label: "Meaning"
        type: "text"
        options:
          maxlength: 50000
        description: "Blank meanings are allowed. They do not remove the auction."
      -
        name: "notes"
        label: "Notes"
        type: "text"
        description: "Notes appear below the meaning. They do not replace it."
      -
        name: "reference"
        label: "Source document"
        type: "text"
        readonly: true
      -
        name: "needsDiscussion"
        label: "Needs discussion"
        type: "boolean"
        description: "Mark an unresolved question or a conflict between meanings."
      -
        name: "artificial"
        label: "Artificial"
        type: "boolean"
      -
        name: "forcing"
        label: "Agreement"
        type: "select"
        default: "0"
        options:
          values:
            -
              value: "0"
              label: "No special agreement"
            -
              value: "1"
              label: "To play"
            -
              value: "2"
              label: "Non-forcing"
            -
              value: "3"
              label: "Constructive"
            -
              value: "4"
              label: "Invitational"
            -
              value: "5"
              label: "Forcing"
            -
              value: "6"
              label: "Game forcing"
            -
              value: "7"
              label: "Slam try"
            -
              value: "8"
              label: "Control bid"
            -
              value: "9"
              label: "Preemptive"
            -
              value: "A"
              label: "Transfer"
            -
              value: "B"
              label: "Puppet"
            -
              value: "C"
              label: "Relay"
            -
              value: "D"
              label: "Asking bid"
            -
              value: "E"
              label: "Asking response"
            -
              value: "M"
              label: "Original BSS status M"
            -
              value: "N"
              label: "Original BSS status N"
            -
              value: "S"
              label: "Original BSS status S"
            -
              value: "T"
              label: "Original BSS status T"
            -
              value: "W"
              label: "Original BSS status W"
      -
        name: "minLength"
        label: "Minimum suit length"
        type: "number"
        default: 0
        options:
          min: 0
          max: 8
          step: 1
        description: "0 means unspecified. This applies to the suit of the last bid."
      -
        name: "maxLength"
        label: "Maximum suit length"
        type: "number"
        default: 8
        options:
          min: 0
          max: 8
          step: 1
        description: "8 keeps the original BSS convention for no stated upper limit."
      -
        name: "order"
        label: "Order"
        type: "number"
        readonly: true
        default: 0
        description: "Calculated after saving. Refresh the list after publication to see the new position."
      -
        name: "parentId"
        label: "parentId"
        type: "string"
        hidden: true
        readonly: true
      -
        name: "opening"
        label: "opening"
        type: "string"
        hidden: true
        readonly: true
      -
        name: "fullAuction"
        label: "fullAuction"
        type: "string"
        hidden: true
        readonly: true
      -
        name: "meaningUpdatedAt"
        label: "meaningUpdatedAt"
        type: "string"
        hidden: true
        readonly: true
      -
        name: "source"
        label: "Original BSS source"
        type: "object"
        hidden: true
        readonly: true
        fields:
          -
            name: "legacyId"
            label: "legacyId"
            type: "number"
            hidden: true
            readonly: true
          -
            name: "bssLine"
            label: "bssLine"
            type: "number"
            hidden: true
            readonly: true
          -
            name: "bssPrefix"
            label: "bssPrefix"
            type: "string"
            hidden: true
            readonly: true
          -
            name: "originalMeaning"
            label: "originalMeaning"
            type: "text"
            hidden: true
            readonly: true
  -
    name: "rules"
    label: "General rules"
    type: "file"
    path: "content/notebook.json"
    format: "json"
    operations:
      create: false
      delete: false
      rename: false
    fields:
      -
        name: "rules"
        label: "Rules"
        type: "object"
        list:
          collapsible:
            collapsed: false
            summary: "{text}"
        fields:
          -
            name: "id"
            label: "ID"
            type: "uuid"
            required: true
            hidden: true
            readonly: true
          -
            name: "text"
            label: "Rule"
            type: "text"
            required: true
          -
            name: "section"
            label: "Applies to"
            type: "select"
            default: "all"
            options:
              values:
                -
                  value: "all"
                  label: "All sections"
                -
                  value: "uncontested"
                  label: "Uncontested"
                -
                  value: "contested"
                  label: "Contested: Our opening"
                -
                  value: "defense"
                  label: "Contested: Opponent opening"
  -
    name: "site"
    label: "Homepage and navigation"
    type: "file"
    path: "content/site.json"
    format: "json"
    operations:
      create: false
      delete: false
      rename: false
    fields:
      -
        name: "title"
        label: "Homepage title"
        type: "string"
        required: true
      -
        name: "description"
        label: "Homepage introduction"
        type: "text"
      -
        name: "systemTitle"
        label: "Bidding tree title"
        type: "string"
        required: true
      -
        name: "sections"
        label: "Sections"
        type: "object"
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: false
            summary: "{title}"
        fields:
          -
            name: "key"
            label: "Section key"
            type: "string"
            required: true
            readonly: true
          -
            name: "title"
            label: "Title"
            type: "string"
            required: true
          -
            name: "description"
            label: "Description"
            type: "text"
